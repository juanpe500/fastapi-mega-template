{% extends "base.html" %}
{% block title %}Email verification — {{ APP_NAME }}{% endblock %}
{% block content %}
  {% if ok %}
    <h1 class="ok">Email verified</h1>
    <p>Your email has been confirmed. <a href="/login">Log in</a></p>
  {% else %}
    <h1 class="error">Invalid link</h1>
    <p>This verification link is invalid or has already been used.</p>
  {% endif %}
{% endblock %}
