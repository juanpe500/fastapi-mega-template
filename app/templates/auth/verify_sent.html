{% extends "base.html" %}
{% block title %}Verify your email — {{ APP_NAME }}{% endblock %}
{% block content %}
  <h1>Check your inbox</h1>
  <p>We sent a verification link to <strong>{{ email }}</strong>.</p>
  <p class="muted">Didn't get it? Check spam, or the app console if SMTP isn't configured.</p>
  <p><a href="/verify/resend">Resend verification email</a></p>
{% endblock %}
