[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E712",  # explicit `== False` is required for SQLAlchemy filters
    "B008",  # FastAPI's Depends()/Form() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"app/security/ratelimit.py" = ["N802"]   # RateLimiter factory keeps a class-like name
"app/security/passwords.py" = ["E402"]   # bcrypt shim must run before CryptContext import
"tests/conftest.py" = ["E402"]           # env vars must be set before the app is imported
"tests/*" = ["E402"]                     # local imports inside tests are deliberate

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
